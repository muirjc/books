openapi: 3.1.0
info:
  title: Family Book Tracker API
  version: 1.0.0
  description: |
    JSON API for spec 001 – Family Reading List. All paths are under /api/v1.
    Every endpoint except POST /auth/login requires the session cookie. Every
    state-changing request (POST, PATCH, DELETE) also requires the X-CSRF-Token header,
    whose value comes from GET /me (or, for sign-in, from GET /auth/csrf).
    "My" endpoints resolve the user from the session only; no endpoint accepts a user id
    for reading entries (Constitution Principle I).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: me
  - name: catalog
  - name: admin

paths:
  /auth/csrf:
    get:
      tags: [auth]
      summary: Get a pre-session CSRF token for sign-in
      security: []
      responses:
        "200":
          description: Token issued; also set as a short-lived signed cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in (FR-001, FR-027)
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in; sets the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          description: Wrong login or password, or account deactivated (same message for all)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Too many failed attempts for this login; retry after the lock ends
          headers:
            Retry-After:
              schema: { type: integer, description: Seconds until sign-in is allowed }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out; ends the current session (FR-001, FR-007)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfFailed" }

  /auth/password:
    post:
      tags: [auth]
      summary: Change my password; ends my other sessions (FR-004, FR-028)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed; must_change_password cleared }
        "400":
          description: Current password is wrong
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me:
    get:
      tags: [me]
      summary: The signed-in user and the session's CSRF token
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/favorite-authors:
    get:
      tags: [me]
      summary: My favorite authors, by sort name (spec 011)
      responses:
        "200":
          description: My favorite authors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Author" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
  /me/favorite-authors/{author_id}:
    parameters:
      - name: author_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [me]
      summary: Add an author to my favorites; already one is fine (spec 011)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: A favorite }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [me]
      summary: Remove an author from my favorites; not one is fine (spec 011)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Not a favorite }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/readings:
    get:
      tags: [me]
      summary: My reading list (FR-021, FR-023)
      parameters:
        - name: q
          in: query
          description: Matches title, author name, author real name or series name
          schema: { type: string, maxLength: 200 }
        - name: author_id
          in: query
          schema: { type: string, format: uuid }
        - name: series_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReadingStatus" }
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, -title, author, -author, series, -series, finished_on, -finished_on,
                   rating, -rating]
            default: title
          description: rating and -rating put unrated entries last, then sort by title (spec 020)
        - name: min_rating
          in: query
          description: Only entries I rated at least this (spec 020)
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: rated
          in: query
          description: true only entries I rated; false only those I haven't (spec 020)
          schema: { type: boolean }
        - name: upcoming
          in: query
          description: Only books not out yet, soonest first; sort is ignored (spec 007)
          schema: { type: boolean, default: false }
        - name: favorite_authors
          in: query
          description: Only books by one of my favorite authors (spec 011)
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of my entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingEntryPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [me]
      summary: Add a book to my list (FR-016, FR-017)
      description: |
        Give either book_id (an existing catalog book) or new_book (created in the same
        transaction), not both.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadingEntryCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Conflict. code=already_on_list (existing_id is my entry, AC-05) or a catalog
            uniqueness conflict for new_book (author, series, ISBN or series number;
            existing_id is the catalog row to offer instead).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/readings/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      tags: [me]
      summary: One of my entries; another member's entry returns 404 (FR-020, AC-04)
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [me]
      summary: Update status, date finished, times read or notes (FR-018, FR-029)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadingEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [me]
      summary: Remove from my list; the catalog book stays (FR-019, AC-07)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

        "422": { $ref: "#/components/responses/ValidationError" }
  /me/readings/{entry_id}/read-again:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      tags: [me]
      summary: Start a re-read; sets status to reading without changing times_read (FR-029)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

        "422": { $ref: "#/components/responses/ValidationError" }
  /me/series/{series_id}:
    parameters:
      - $ref: "#/components/parameters/SeriesId"
    get:
      tags: [me]
      summary: My books in one series, in series order; unnumbered last (FR-022, AC-22)
      responses:
        "200":
          description: Series view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySeriesView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

        "422": { $ref: "#/components/responses/ValidationError" }
  /books:
    get:
      tags: [catalog]
      summary: Type-ahead search of catalog books by title, author name, real name, story title (spec 009) or exact ISBN (FR-010)
      parameters:
        - $ref: "#/components/parameters/TypeAheadQuery"
        - $ref: "#/components/parameters/TypeAheadLimit"
      responses:
        "200":
          description: Up to `limit` matches, prefix matches first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }

        "422": { $ref: "#/components/responses/ValidationError" }
  /books/{book_id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [catalog]
      summary: A catalog book, with its current summary
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [catalog]
      summary: Edit a catalog book; any member (FR-009, AC-32)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /books/{book_id}/summaries:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [catalog]
      summary: Summary history, newest first (FR-024)
      responses:
        "200":
          description: Summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [catalog]
      summary: Save a hand-written summary as the current one (FR-024, FR-025)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryCreate" }
      responses:
        "201":
          description: Saved as current; the previous summary is kept in history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /books/{book_id}/summary-drafts:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      tags: [catalog]
      summary: An AI draft of the book's summary; nothing is saved (spec 012)
      description: |
        Returns the newest draft for the book from the last 30 days without asking the AI
        (it doesn't count against the daily allowance), unless regenerate is true. Save a
        draft with POST /books/{book_id}/summaries and its draft_id.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryDraftRequest" }
      responses:
        "200":
          description: An unsaved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryDraft" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            Request failed validation, or code=not_enough_information, ai_declined or
            draft_rejected: no draft this time; write the summary by hand
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/Problem"
        "429":
          description: code=draft_limit_reached; today's AI drafts are used
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: code=ai_not_configured or ai_unavailable (timeout or AI service error)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /books/{book_id}/stories:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [catalog]
      summary: The stories a book contains, with a series by series name then number, then those without one in the order added (specs 009, 019)
      responses:
        "200":
          description: Stories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [catalog]
      summary: Add a new or existing story to a book; any member (spec 009)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryAdd" }
      responses:
        "200":
          description: The book already contained this story; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "201":
          description: Added to the book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /books/{book_id}/stories/{story_id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/StoryId"
    delete:
      tags: [catalog]
      summary: Take a story out of a book; it is deleted when no other book has it (spec 009)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /stories:
    get:
      tags: [catalog]
      summary: The stories in a series, by number (spec 009)
      parameters:
        - name: series_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /stories/{story_id}:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    get:
      tags: [catalog]
      summary: A story, with the books that contain it (spec 009)
      responses:
        "200":
          description: Story
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [catalog]
      summary: Edit a story; any member (spec 009)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /authors:
    get:
      tags: [catalog]
      summary: Type-ahead search by name or real name (FR-010)
      parameters:
        - $ref: "#/components/parameters/TypeAheadQuery"
        - $ref: "#/components/parameters/TypeAheadLimit"
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Author" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [catalog]
      summary: Create an author (FR-011, FR-014)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Author" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /authors/{author_id}:
    parameters:
      - name: author_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [catalog]
      summary: An author
      responses:
        "200":
          description: Author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Author" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [catalog]
      summary: Edit an author, including pen name and real name (FR-009, FR-014)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Author" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [catalog]
      summary: Delete an author no book lists; any member (spec 008)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Books list this author (code author_has_books), or a member keeps them as a
            favorite author (code author_is_favorite, spec 011; it doesn't say who); nothing
            was deleted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /series:
    get:
      tags: [catalog]
      summary: Type-ahead search (FR-010)
      parameters:
        - $ref: "#/components/parameters/TypeAheadQuery"
        - $ref: "#/components/parameters/TypeAheadLimit"
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Series" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [catalog]
      summary: Create a series (FR-011)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /series/{series_id}:
    parameters:
      - $ref: "#/components/parameters/SeriesId"
    get:
      tags: [catalog]
      summary: A series
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [catalog]
      summary: Rename a series (FR-009)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CatalogConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users:
    get:
      tags: [admin]
      summary: List accounts; Admin only (FR-003)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create an account; Admin only (FR-003, FR-008, FR-028)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created; must_change_password is true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Login already in use (ignoring capitalization), AC-29
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change display name, role or active state; Admin only (FR-004, FR-005)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated; deactivation ends the account's sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: code=last_admin; the last active Admin cannot be deactivated or demoted (AC-26)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{user_id}/password-reset:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Set a temporary password; Admin only (FR-004, AC-11)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Reset; must_change_password set and the account's sessions ended }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session

  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    EntryId:
      name: entry_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookId:
      name: book_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StoryId:
      name: story_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeriesId:
      name: series_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    TypeAheadQuery:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    TypeAheadLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 25, default: 10 }

  responses:
    Unauthenticated:
      description: No valid session
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        code=csrf_failed, password_change_required or not_admin
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CsrfFailed:
      description: code=csrf_failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PasswordChangeRequired:
      description: code=password_change_required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Does not exist, or belongs to another member (indistinguishable)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CatalogConflict:
      description: |
        Uniqueness conflict in the catalog. code is one of author_exists, series_exists,
        isbn_exists, series_number_taken, story_number_taken (spec 009); existing_id and
        existing_label identify the row to offer instead.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Conflict" }
    ValidationError:
      description: Request failed validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }

  schemas:
    Problem:
      type: object
      required: [code, title]
      properties:
        code: { type: string, description: Stable machine-readable code }
        title: { type: string, description: Human-readable message }
        detail: { type: string }
    Conflict:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [existing_id]
          properties:
            existing_id: { type: string, format: uuid }
            existing_label: { type: string }
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

    CsrfToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login: { type: string, minLength: 1, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 128 }

    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
        new_password: { $ref: "#/components/schemas/Password" }

    PasswordReset:
      type: object
      required: [temporary_password]
      additionalProperties: false
      properties:
        temporary_password: { $ref: "#/components/schemas/Password" }

    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: At least 8 characters; no other complexity rules (FR-028)

    Role:
      type: string
      enum: [member, admin]

    CurrentUser:
      type: object
      required: [id, display_name, login, role, must_change_password, csrf_token]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        login: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        must_change_password: { type: boolean }
        csrf_token: { type: string }

    Account:
      type: object
      required: [id, display_name, login, role, is_active, must_change_password, created_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        login: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [display_name, login, initial_password]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        login:
          type: string
          minLength: 3
          maxLength: 255
          description: Email address or username; an email address is not required
        role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          default: member
        initial_password: { $ref: "#/components/schemas/Password" }

    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }

    AuditInfo:
      type: object
      required: [created_by, created_at, updated_by, updated_at]
      properties:
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/UserRef" }
        updated_at: { type: string, format: date-time }

    UserRef:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }

    Author:
      allOf:
        - type: object
          required: [id, name, sort_name, is_pen_name, real_name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            sort_name: { type: string }
            is_pen_name: { type: boolean }
            real_name: { type: [string, "null"] }
        - $ref: "#/components/schemas/AuditInfo"

    AuthorCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sort_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Defaults to "Last, First" derived from name
        is_pen_name: { type: boolean, default: false }
        real_name:
          type: [string, "null"]
          maxLength: 200
          description: Only allowed when is_pen_name is true (FR-014)

    AuthorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sort_name: { type: string, minLength: 1, maxLength: 200 }
        is_pen_name: { type: boolean }
        real_name: { type: [string, "null"], maxLength: 200 }

    Series:
      allOf:
        - type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        - $ref: "#/components/schemas/AuditInfo"

    SeriesWrite:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    SeriesNumber:
      type: [string, "null"]
      pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$"
      description: Decimal as a string, 0–999.99, e.g. "2.5"; only with a series (FR-013)

    Isbn13:
      type: [string, "null"]
      description: |
        13 digits after removing spaces and hyphens, with a valid checksum (FR-015).
        Responses always return the 13 digits only.

    BookAuthorRef:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        real_name: { type: [string, "null"] }
        position: { type: integer, minimum: 1 }

    Book:
      allOf:
        - type: object
          required: [id, title, authors, series, series_number, isbn_13, release_date, current_summary]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            authors:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/BookAuthorRef" }
            series:
              oneOf:
                - $ref: "#/components/schemas/SeriesRef"
                - type: "null"
            series_number: { $ref: "#/components/schemas/SeriesNumber" }
            isbn_13: { $ref: "#/components/schemas/Isbn13" }
            release_date: { $ref: "#/components/schemas/ReleaseDate" }
            current_summary:
              oneOf:
                - $ref: "#/components/schemas/Summary"
                - type: "null"
        - $ref: "#/components/schemas/AuditInfo"

    SeriesRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    BookRef:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }

    Story:
      description: |
        A story contained in one or more books (spec 009). series and series_number are
        both null for a story without a series (spec 019).
      allOf:
        - type: object
          required: [id, title, authors, series, series_number, books]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            authors:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/BookAuthorRef" }
            series:
              oneOf:
                - $ref: "#/components/schemas/SeriesRef"
                - type: "null"
            series_number:
              type: [string, "null"]
              pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$"
            books:
              type: array
              minItems: 1
              description: The books that contain it, by title
              items: { $ref: "#/components/schemas/BookRef" }
        - $ref: "#/components/schemas/AuditInfo"

    StoryAdd:
      type: object
      additionalProperties: false
      description: |
        Either story_id (add an existing story), or title and author_ids (add a new one);
        not both. A new story's series_id and series_number are given together, or both
        left out for a story without a series (spec 019).
      properties:
        story_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        author_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        series_id: { type: string, format: uuid }
        series_number:
          type: string
          pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$"

    NewBookStory:
      type: object
      additionalProperties: false
      description: |
        Spec 013: either story_id (an existing story), or a title (a new one); not both.
        A new story with series_number and no series_id takes the new book's series; with
        neither it has no series; series_id without series_number is refused (spec 019).
        author_ids default to the new book's.
      properties:
        story_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        series_number:
          type: string
          pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$"
        series_id: { type: string, format: uuid }
        author_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }

    StoryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Spec 019: series_id and series_number may be set to null together, making a story
        without a series. The result must have both or neither.
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        series_id: { type: [string, "null"], format: uuid }
        series_number:
          type: [string, "null"]
          pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$"

    BookCreate:
      type: object
      required: [title, author_ids]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Existing author ids in cover order
          items: { type: string, format: uuid }
        series_id: { type: [string, "null"], format: uuid }
        series_number: { $ref: "#/components/schemas/SeriesNumber" }
        isbn_13: { $ref: "#/components/schemas/Isbn13" }
        release_date: { $ref: "#/components/schemas/ReleaseDate" }
        summary:
          type: [string, "null"]
          maxLength: 5000
          description: Optional hand-written summary saved with the book (FR-012, FR-024)

    BookUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        series_id: { type: [string, "null"], format: uuid }
        series_number: { $ref: "#/components/schemas/SeriesNumber" }
        isbn_13: { $ref: "#/components/schemas/Isbn13" }
        release_date: { $ref: "#/components/schemas/ReleaseDate" }

    ReleaseDate:
      type: [string, "null"]
      format: date
      description: Expected or actual release date, entered by hand (spec 007)

    Summary:
      type: object
      required: [id, book_id, text, origin, is_current, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        text: { type: string }
        origin: { type: string, enum: [ai, ai_edited, manual] }
        model: { type: [string, "null"] }
        source_urls:
          type: [array, "null"]
          items: { type: string, format: uri }
        is_current: { type: boolean }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }

    SummaryCreate:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        draft_id:
          type: [string, "null"]
          format: uuid
          description: |
            The AI draft this text came from (spec 012). With the app's own current draft of
            this book, the summary is saved as ai or ai_edited; otherwise as manual.

    SummaryDraftRequest:
      type: object
      additionalProperties: false
      properties:
        regenerate: { type: boolean, default: false }

    SummaryDraft:
      type: object
      required: [id, text, source_urls, model, series_suggestion, cached, created_at, drafts_left_today]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        source_urls: { type: array, items: { type: string } }
        model: { type: string }
        series_suggestion:
          oneOf:
            - $ref: "#/components/schemas/SeriesSuggestion"
            - type: "null"
        cached: { type: boolean, description: Drafted earlier and reused; no AI request was made }
        created_at: { type: string, format: date-time }
        drafts_left_today: { type: integer, minimum: 0 }

    SeriesSuggestion:
      type: object
      required: [name, number]
      properties:
        name: { type: string }
        number: { $ref: "#/components/schemas/SeriesNumber" }

    ReadingStatus:
      type: string
      enum: [want_to_read, reading, finished]

    ReadingEntry:
      type: object
      required:
        [id, book, status, finished_on, times_read, notes, pre_ordered, rating, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        book: { $ref: "#/components/schemas/Book" }
        status: { $ref: "#/components/schemas/ReadingStatus" }
        finished_on: { type: [string, "null"], format: date }
        times_read: { type: integer, minimum: 0, maximum: 99 }
        notes: { type: [string, "null"] }
        pre_ordered: { type: boolean, description: "The owner's own Pre-ordered flag (spec 007)" }
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: The owner's own rating, 1 to 5; null for none (spec 020)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReadingEntryCreate:
      type: object
      additionalProperties: false
      description: Exactly one of book_id or new_book is required
      properties:
        book_id: { type: string, format: uuid }
        new_book: { $ref: "#/components/schemas/BookCreate" }
        status:
          allOf: [{ $ref: "#/components/schemas/ReadingStatus" }]
          default: finished
        finished_on:
          type: [string, "null"]
          format: date
          description: Not in the future
        notes: { type: [string, "null"], maxLength: 10000 }
        pre_ordered: { type: boolean, default: false }
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          default: null
          description: My rating, 1 to 5 (spec 020)
        stories:
          type: [array, "null"]
          maxItems: 50
          description: |
            Spec 013: stories in the new book, saved with it (all or nothing). Only with
            new_book. A new story's series and authors default to the book's; no two items
            may share a series and number or a story_id. A number held by another story is
            a 409 story_number_taken naming it.
          items: { $ref: "#/components/schemas/NewBookStory" }
      oneOf:
        - required: [book_id]
          not: { required: [new_book] }
        - required: [new_book]
          not: { required: [book_id] }

    ReadingEntryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/ReadingStatus" }
        finished_on: { type: [string, "null"], format: date }
        times_read:
          type: integer
          minimum: 0
          maximum: 99
          description: Overrides the automatic increment when sent with a status change
        notes: { type: [string, "null"], maxLength: 10000 }
        pre_ordered: { type: boolean }
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: My rating, 1 to 5; null clears it; left out keeps it (spec 020)

    ReadingEntryPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReadingEntry" }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
        total: { type: integer, minimum: 0 }

    MySeriesView:
      type: object
      required: [series, entries]
      properties:
