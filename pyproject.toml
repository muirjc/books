[project]
name = "book-tracker"
version = "0.1.0"
description = "Family Book Tracker: private reading lists over a shared family catalog"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[project.scripts]
book-tracker = "book_tracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.8",
    "openapi-core>=0.19",
    "pytest-playwright>=0.5",
    "axe-playwright-python>=0.1.4",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_tracker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "S607", "S608"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "ac(id): links a test to a spec acceptance criterion, e.g. 001/AC-01",
    "a11y: browser accessibility tests (Playwright + axe-core)",
    "perf: performance budget tests",
    "deploy: Pi backup/restore scripts against the real Compose services (needs Docker and restic)",
]
addopts = "-m 'not perf and not a11y and not deploy'"

[tool.coverage.run]
source = ["src/book_tracker"]
branch = true
# SQLAlchemy's async layer runs code in greenlets; the live a11y server uses a thread.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
