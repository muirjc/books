{% extends "base.html" %}
{% block title %}My books{% endblock %}
{% block content %}
<div class="page-head">
  <h1>My books</h1>
  <p><a class="button button-primary" href="/books/add">Add a book</a></p>
</div>

<form method="get" action="/" role="search" aria-label="Search and filter my books" class="filters"
      data-fold="{{ 'open' if filters_open else 'closed' }}" hx-get="/" hx-target="#reading-list" hx-push-url="true"
      hx-trigger="submit, change, input changed delay:300ms from:#q">
  <div class="field">
    <label for="q">Search my books</label>
    <input id="q" name="q" type="search" maxlength="200" value="{{ filters.q }}" autocomplete="off">
  </div>
  {# Spec 003: on a phone, app.js shows this and folds the rest; without JavaScript all show. #}
  <button type="button" class="filters-toggle" aria-controls="filter-extra"
          aria-expanded="{{ 'true' if filters_open else 'false' }}" hidden>Sort and filter</button>
  <div id="filter-extra" class="filter-extra">
  <div class="field">
    <label for="sort">Sort by</label>
    <select id="sort" name="sort">
      {% for value, label in sort_options %}
      <option value="{{ value }}"{% if value == sort %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="">Any status</option>
      {% for value, label in statuses %}
      <option value="{{ value }}"{% if value == filters.status %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="author_id">Author</label>
    <select id="author_id" name="author_id">
      <option value="">Any author</option>
      {% for id, name in author_options %}
      <option value="{{ id }}"{% if id | string == filters.author_id %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="series_id">Series</label>
    <select id="series_id" name="series_id">
      <option value="">Any series</option>
      {% for id, name in series_options %}
      <option value="{{ id }}"{% if id | string == filters.series_id %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="actions">
    <button type="submit">Apply</button>
    {% if filtered %}<a href="/">Clear</a>{% endif %}
  </div>
  </div>
</form>

<div id="reading-list" aria-live="polite">
  {% include "partials/reading_list.html" %}
</div>
{% endblock %}
