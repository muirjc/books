openapi: 3.1.0
info:
  title: Family Book Tracker API – author import (spec 002)
  version: 1.1.0
  description: |
    Operations added by spec 002 – Import an Author's Books. All paths are under /api/v1.
    The rest of the API is unchanged and described in
    specs/001-family-reading-list/contracts/openapi.yaml; the shared components below are
    copied from it so this file validates on its own.
    Every endpoint requires the session cookie; POST also requires the X-CSRF-Token header.
    The member is always taken from the session; no endpoint accepts a user id
    (Constitution Principle I). Open Library is the only source contacted (research R1).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: import
  - name: me

paths:
  /import/authors:
    get:
      tags: [import]
      summary: Search Open Library for authors by name (FR-001, FR-002)
      description: |
        Results are reused for 24 hours (FR-017). An empty list means no author was found
        (AC-09).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Matching authors, in Open Library's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorCandidateList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }

  /import/authors/{author_key}/works:
    get:
      tags: [import]
      summary: List an author's works with their catalog and list state (FR-003 to FR-006)
      description: |
        Works are de-duplicated (AC-12). state is computed for the signed-in member:
        on_my_list (cannot be selected), in_catalog, or new (FR-005). At most 2,000 works are
        returned; truncated is true when Open Library has more (FR-020).
      parameters:
        - $ref: "#/components/parameters/AuthorKey"
        - name: sort
          in: query
          schema: { type: string, enum: [title, year], default: title }
        - name: q
          in: query
          description: Keep only works whose title contains this text (ignoring case)
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: The author's works
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }

  /me/imports:
    post:
      tags: [me]
      summary: Add selected works to my list, creating catalog books as needed (FR-007 to FR-014)
      description: |
        Works are read from the server's cached list for the author (research R8); nothing
        is fetched from Open Library. Works already on my list are skipped (AC-17). New books
        have no series and no ISBN (FR-010, FR-011).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Imported; the summary (FR-012)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            code=results_expired: the cached list for this author has expired; list the
            works again before confirming.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session

  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    AuthorKey:
      name: author_key
      in: path
      required: true
      description: Open Library author key, for example OL1394865A
      schema: { type: string, pattern: "^OL[0-9]+A$", maxLength: 40 }

  responses:
    Unauthenticated:
      description: No valid session
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: code=csrf_failed or password_change_required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Open Library has no author with this key
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Request failed validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    SourceUnavailable:
      description: |
        code=source_unavailable: Open Library timed out (10 s), refused the request or
        returned an error. Nothing was changed (AC-13).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [code, title]
      properties:
        code: { type: string, description: Stable machine-readable code }
        title: { type: string, description: Human-readable message }
        detail: { type: string }
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    ReadingStatus:
      type: string
      enum: [want_to_read, reading, finished]

    AuthorCandidate:
      type: object
      required: [author_key, name, work_count]
      properties:
        author_key: { type: string, pattern: "^OL[0-9]+A$" }
        name: { type: string }
        birth_date: { type: [string, "null"], description: As Open Library gives it }
        death_date: { type: [string, "null"] }
        top_work: { type: [string, "null"] }
        work_count: { type: integer, minimum: 0 }
    AuthorCandidateList:
      type: object
      required: [authors]
      properties:
        authors:
          type: array
          items: { $ref: "#/components/schemas/AuthorCandidate" }

    WorkState:
      type: string
      enum: [new, in_catalog, on_my_list]
    WorkCandidate:
      type: object
      required: [work_key, title, author_names, state]
      properties:
        work_key: { type: string, pattern: "^OL[0-9]+W$" }
        title: { type: string }
        first_publish_year: { type: [integer, "null"] }
        author_names:
          type: array
          minItems: 1
          items: { type: string }
          description: In Open Library's order
        state: { $ref: "#/components/schemas/WorkState" }
        book_id:
          type: [string, "null"]
          format: uuid
          description: The catalog book, when state is in_catalog or on_my_list
    WorkList:
      type: object
      required: [author, works, total, truncated, fetched_at]
      properties:
        author: { $ref: "#/components/schemas/AuthorCandidate" }
        works:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/WorkCandidate" }
        total: { type: integer, minimum: 0, description: Open Library's total for the author }
        truncated: { type: boolean }
        fetched_at: { type: string, format: date-time }

    ImportRequest:
      type: object
      additionalProperties: false
      required: [author_key, work_keys]
      properties:
        author_key: { type: string, pattern: "^OL[0-9]+A$" }
        work_keys:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { type: string, pattern: "^OL[0-9]+W$" }
        status:
          allOf: [{ $ref: "#/components/schemas/ReadingStatus" }]
          default: finished
    ImportedBook:
      type: object
      required: [book_id, title, entry_id, new_to_catalog]
      properties:
        book_id: { type: string, format: uuid }
        title: { type: string }
        entry_id: { type: string, format: uuid }
        new_to_catalog: { type: boolean }
    SkippedBook:
      type: object
      required: [book_id, title]
      properties:
        book_id: { type: string, format: uuid }
        title: { type: string }
    ImportResult:
      type: object
      required: [added, skipped_on_list]
      properties:
        added:
          type: array
          items: { $ref: "#/components/schemas/ImportedBook" }
        skipped_on_list:
          type: array
          items: { $ref: "#/components/schemas/SkippedBook" }
