# App images for the Raspberry Pi (spec section 10.4).
#
# - Pull request: build linux/amd64 only, no push, to catch a broken Dockerfile early.
# - Merge to main: once the `ci` workflow passes on that commit, build linux/arm64 and
#   linux/amd64 and push ghcr.io/muirjc/books:sha-<7-char sha> and :latest.
# - Manual run (Actions tab) on main: rebuild and push the current main.
name: images

on:
  pull_request:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/muirjc/books

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          # PR builds read the cache but don't write it, so main's cache stays clean.

  publish:
    # Only a ci run triggered by a push to main that passed, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Publish one merge at a time, in order, so an older build can't overwrite :latest.
    concurrency:
      group: images-publish
      cancel-in-progress: false
    env:
      # workflow_run runs on main's newest commit; build the commit ci actually tested.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Tags
        id: tags
        run: |
          short="${HEAD_SHA:0:7}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-$short"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
            org.opencontainers.image.title=books
          cache-from: type=gha
          cache-to: type=gha,mode=max
