{#- An ARIA combobox text input with HTMX suggestions (FR-010, FR-030).
    Expects: name, kind (books|authors|series), id_field, value, errors, maxlength, extra_hint -#}
{% from "macros.html" import described %}
<div class="combobox">
  <input id="{{ name }}" name="{{ name }}" type="text" maxlength="{{ maxlength }}" autocomplete="off"
         value="{{ value }}" role="combobox" aria-autocomplete="list" aria-expanded="false"
         aria-controls="{{ name }}-listbox" data-id-field="{{ id_field }}"
         hx-get="/suggest/{{ kind }}" hx-trigger="input changed delay:250ms" hx-target="#{{ name }}-suggestions"
         hx-vals='{"field": "{{ name }}"}' hx-sync="this:replace"{{ described(errors, name) }}>
  <div id="{{ name }}-suggestions">
    <ul class="suggestions" role="listbox" id="{{ name }}-listbox" aria-label="Suggestions"></ul>
  </div>
</div>
